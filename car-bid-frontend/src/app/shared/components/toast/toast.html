<div class="fixed bottom-4 right-4 z-50 flex flex-col gap-2">
  @for (toast of toastService.toasts(); track toast.id){
    <div class="px-4 py-3 rounded shadow-lg text-white font-medium transition-all" [class.bg-green-500]="toast.type === 'success'" [class.bg-red-500]="toast.type === 'error'">
    {{toast.message}}
    </div>
  }
</div>
