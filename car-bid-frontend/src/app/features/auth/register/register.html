<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">

    <div class="mb-8 text-center">
      <h2 class="text-3xl font-bold text-gray-800">Create an Account</h2>
      <p class="text-gray-500 mt-2">Join CarBid to start bidding</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6">

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="test@test.com"
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
        >
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
        >
        <p class="text-xs text-gray-500 mt-1">Must be at least 6 characters.</p>
      </div>

      <button
        type="submit"
        [disabled]="registerForm.invalid"
        class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed shadow-md"
      >
        Sign Up
      </button>

    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
      Already have an account?
      <a routerLink="/login" class="text-blue-600 hover:underline font-semibold">Login here</a>
    </p>

  </div>
</div>
