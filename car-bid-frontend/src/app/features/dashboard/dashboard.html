<div class="min-h-screen bg-gray-100 p-8">
  <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Create a New Auction</h1>

    <form [formGroup]="createForm" (ngSubmit)="onSubmit()" class="space-y-4">

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Brand</label>
          <input type="text" formControlName="brand" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Model</label>
          <input type="text" formControlName="model" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Year</label>
          <input type="number" formControlName="year" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Car Value ($)</label>
          <input type="number" formControlName="price" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
        </div>
      </div>

      <hr class="my-6">

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Starting Bid ($)</label>
          <input type="number" formControlName="startingPrice" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Days Active</label>
          <input type="number" formControlName="daysUntilEnd" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
        </div>
      </div>

      <button type="submit" [disabled]="createForm.invalid"
              class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded hover:bg-blue-700 disabled:opacity-50 mt-4">
        Create Auction
      </button>

    </form>
  </div>
</div>
